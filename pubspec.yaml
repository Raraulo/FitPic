name: fitpic
description: Estilista personal con IA, clima y almacenamiento local.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.1.0
  image: ^4.2.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  remove_alpha_ios: true
  background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/ropa/
    - .env
